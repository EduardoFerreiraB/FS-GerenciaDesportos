name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx pytest-asyncio

    - name: Run tests with coverage
      env:
        DATABASE_URL: sqlite:///./test.db
        SECRET_KEY: test_secret_key_for_ci_pipeline
      run: |
        python -m pytest --cov=app --cov-report=xml -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Build
      run: npm run build

  deploy:
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Render Deploy Webhook
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"


